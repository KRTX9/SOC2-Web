<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Security Headers (Meta tags - some headers like X-Frame-Options need HTTP headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://challenges.cloudflare.com;
      style-src 'self' 'unsafe-inline' https://accounts.google.com;
      img-src 'self' data: https://*.googleusercontent.com;
      connect-src 'self' data: http://localhost:8000 http://127.0.0.1:8000 https://accounts.google.com https://challenges.cloudflare.com https://*.challenges.cloudflare.com https://cloudflarecaptcha.com https://*.cloudflarecaptcha.com https://dnstest.dev;
      frame-src https://accounts.google.com https://challenges.cloudflare.com;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    
    <!-- Favicon and Metadata -->
    <link rel="icon" type="image/png" href="/logor.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enterprise-grade secure authentication platform with multi-factor authentication" />
    <meta name="theme-color" content="#0a0a0a" />
    
    <title>Secure Auth - Enterprise Authentication</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
